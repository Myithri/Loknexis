<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOKNEXIS | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef5ff;color:#17345c}
header{background:white;padding:18px 8%;display:flex;justify-content:space-between}
header a{color:#1261b5;text-decoration:none;font-weight:bold}
.brand{font-size:24px;font-weight:bold;color:#1261b5}
.box{max-width:460px;margin:45px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #17345c18}
h1{text-align:center;color:#145da8}
.roles{display:flex;gap:8px;margin:22px 0}
.roles button{flex:1;padding:12px 5px;border:1px solid #b8cce5;background:white;border-radius:9px;cursor:pointer}
.roles button.active{background:#1261b5;color:white}
input{width:100%;padding:13px;margin:9px 0;border:1px solid #bdcde0;border-radius:8px;font-size:15px}
.submit{width:100%;padding:14px;background:#1261b5;color:white;border:0;border-radius:8px;font-size:16px;cursor:pointer;margin-top:12px}
#message{text-align:center;margin-top:15px;color:#c0392b;min-height:20px}
.hint{font-size:13px;color:#63758d;text-align:center}
</style>
</head>
<body>

<header>
<div class="brand">LOKNEXIS</div>
<a href="index.html">HOME</a>
</header>

<div class="box">
<h1>Welcome to LOKNEXIS</h1>
<p style="text-align:center">Choose your account type</p>

<div class="roles">
<button class="active" type="button" onclick="chooseRole('admin',this)">Admin</button>
<button type="button" onclick="chooseRole('worker',this)">Worker</button>
<button type="button" onclick="chooseRole('customer',this)">Customer</button>
</div>

<form onsubmit="login(event)">
<div id="fields"></div>
<button class="submit" type="submit">Continue</button>
</form>

<p id="message"></p>
<p class="hint">LOKNEXIS – Skilled Hands. Stronger Communities.</p>
</div>

<script>
let role = "admin";

function chooseRole(selectedRole, button) {
    role = selectedRole;

    document.querySelectorAll(".roles button").forEach(function(btn) {
        btn.classList.remove("active");
    });

    button.classList.add("active");
    document.getElementById("message").textContent = "";
    showFields();
}

function showFields() {
    let fields = document.getElementById("fields");

    if (role === "admin") {
        fields.innerHTML = `
            <input type="email" id="email"
            placeholder="Admin email" required>

            <input type="password" id="password"
            placeholder="Admin password" required>
        `;
    }
    else if (role === "worker") {
        fields.innerHTML = `
            <input type="text" id="workerName"
            placeholder="Enter worker name" required>

            <input type="password" id="password"
            placeholder="Worker password" required>
        `;
    }
    else {
        fields.innerHTML = `
            <input type="text" id="customerName"
            placeholder="Your full name" required>

            <input type="tel" id="phone"
            placeholder="10-digit mobile number"
            pattern="[0-9]{10}" maxlength="10" required>
        `;
    }
}

function login(event) {
    event.preventDefault();

    let message = document.getElementById("message");

    if (role === "admin") {

        let email = document.getElementById("email").value.trim().toLowerCase();
        let password = document.getElementById("password").value.trim();

        if (
            email === "writetomyithri@gmail.com" &&
            password === "123456"
        ) {
            sessionStorage.setItem("userRole", "admin");
            sessionStorage.setItem("userName", "Administrator");

            window.location.href = "admin-dashboard.html";
        }
        else {
            message.textContent = "Invalid administrator email or password.";
        }
    }

    else if (role === "worker") {

        let name = document.getElementById("workerName").value.trim();
        let password = document.getElementById("password").value.trim();

        let workers = ["Arun", "Kumar", "Priya", "Ravi", "Meena", "Suresh"];

        let matchedWorker = workers.find(function(worker) {
            return worker.toLowerCase() === name.toLowerCase();
        });

        if (matchedWorker && password === "012345") {
            sessionStorage.setItem("userRole", "worker");
            sessionStorage.setItem("userName", matchedWorker);

            window.location.href = "worker-dashboard.html";
        }
        else {
            message.textContent = "Invalid worker name or password.";
        }
    }

    else {

        let name = document.getElementById("customerName").value.trim();
        let phone = document.getElementById("phone").value.trim();

        sessionStorage.setItem("userRole", "customer");
        sessionStorage.setItem("userName", name);
        sessionStorage.setItem("userPhone", phone);

        window.location.href = "booking.html";
    }
}

showFields();
</script>

</body>
</html>
